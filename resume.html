<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume | Mohit Soni</title>
<link rel="icon" type="image/png" href="19b00051ca777926facc0e0280e98070.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header"></header>

<section class="section-pad pt-32">
  <div class="container-wide">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-14 reveal">
      <div>
        <p class="eyebrow mb-3">Curriculum Vitae</p>
        <h1 class="text-4xl md:text-5xl font-bold">My Resume</h1>
      </div>
      <a id="resume-download-btn" href="" target="_blank" class="btn-accent self-start"><i class="fa-solid fa-download"></i> Download PDF</a>
    </div>

    <div class="grid md:grid-cols-2 gap-14">
      <div class="reveal">
        <h2 class="text-2xl font-bold mb-8"><i class="fa-solid fa-graduation-cap text-accent mr-2"></i> Education</h2>
        <div id="education-timeline" class="timeline">
          <p class="text-sm" style="color:var(--text-muted);">Loading...</p>
        </div>
      </div>
      <div class="reveal">
        <h2 class="text-2xl font-bold mb-8"><i class="fa-solid fa-briefcase text-accent mr-2"></i> Experience</h2>
        <div id="experience-timeline" class="timeline">
          <p class="text-sm" style="color:var(--text-muted);">Loading...</p>
        </div>
      </div>
    </div>

    <div class="mt-16 reveal">
      <h2 class="text-2xl font-bold mb-8"><i class="fa-solid fa-toolbox text-accent mr-2"></i> Services</h2>
      <div id="services-grid" class="grid md:grid-cols-2 gap-5">
        <p class="text-sm" style="color:var(--text-muted);">Loading...</p>
      </div>
    </div>
  </div>
</section>

<!-- SKILLS FULL -->
<section class="section-pad" style="background:var(--bg-darker);">
  <div class="container-wide">
    <div class="text-center mb-14 reveal">
      <p class="eyebrow mb-3">Toolkit</p>
      <h2 class="text-3xl md:text-4xl font-bold">Skills &amp; Software Proficiency</h2>
    </div>
    <div id="skills-full-grid" class="grid md:grid-cols-2 gap-10">
      <p class="text-sm" style="color:var(--text-muted);">Loading...</p>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/api.js"></script>
<script src="js/site.js"></script>
<script src="js/resume.js"></script>
</body>
</html>
