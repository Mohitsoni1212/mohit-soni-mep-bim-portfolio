<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects | Mohit Soni</title>
<link rel="icon" type="image/png" href="mohit-soni-profile.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header"></header>

<section class="section-pad pt-32">
  <div class="container-wide">
    <div class="text-center mb-10 reveal">
      <p class="eyebrow mb-3">Portfolio</p>
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Projects &amp; Case Studies</h1>
      <p class="max-w-xl mx-auto text-sm" style="color:var(--text-muted);">MEP BIM models, Revit &amp; Navisworks coordination, clash detection reports and construction documentation — explore full asset galleries for every project.</p>
    </div>

    <div class="flex flex-wrap justify-center gap-3 mb-4 reveal">
      <input id="project-search" type="text" placeholder="Search projects..." class="form-input" style="max-width:280px;">
    </div>
    <div id="filter-bar" class="flex flex-wrap justify-center gap-3 mb-12 reveal">
      <button class="filter-btn active" data-filter="All">All</button>
    </div>

    <div id="projects-grid" class="grid md:grid-cols-3 gap-7">
      <p class="text-sm col-span-3 text-center" style="color:var(--text-muted);">Loading projects...</p>
    </div>
    <p id="no-results" class="text-sm text-center mt-10 hidden" style="color:var(--text-muted);">No projects match your search/filter.</p>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/api.js"></script>
<script src="js/site.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
